version: '3.8'

services:
  postgres:
    # pgvector (22-01), pinned by digest like the test harnesses and CI.
    # ⚠ An existing postgres_data volume was initialised by the Alpine image
    # (musl); this one is Debian (glibc). See docs/local-development.md,
    # "The Postgres image", before starting it on an old volume.
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=coderag
      - POSTGRES_USER=coderag
      - POSTGRES_PASSWORD=coderag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coderag"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ⚠ COMPOSE DOES NOT START THE BACKEND TODAY: it panics without
  # SUPABASE_WEBHOOK_SECRET, and the internal listener also needs the GitHub
  # App credentials, none of which compose passes (docs/local-development.md,
  # "Run the backend"). Run it directly. Secrets in compose are Phase 24's.
  backend:
    build: ./services/backend
    ports:
      - "8080:8080"
    # The internal listener (22-04) serves the worker's repository-token
    # route. It is reachable on the compose network ONLY: `expose`, NEVER
    # `ports:` -- publishing it would let anyone who can read a lease owner
    # mint repository tokens (docs/internal-api.md; Phase 24 keeps it so).
    expose:
      - "8081"
    volumes:
      - ./services/backend:/app
    environment:
      - ENV=development
      - DATABASE_URL=postgres://coderag:coderag@postgres:5432/coderag?sslmode=disable
      - RAG_SERVICE_URL=http://rag-api:8000
      # The service name, which resolves to this container's own address on
      # the compose network. Never a wildcard: the backend refuses `:8081`,
      # `0.0.0.0:8081` and their spellings unless explicitly overridden, and
      # the override is not used here (PR #52's review, L3).
      - INTERNAL_ADDR=backend:8081
    depends_on:
      postgres:
        condition: service_healthy

  rag-api:
    build:
      context: ./services/workers
      dockerfile: Dockerfile.api
    ports:
      - "8001:8000"
    volumes:
      - ./services/workers:/app
    environment:
      - DATABASE_URL=postgres://coderag:coderag@postgres:5432/coderag?sslmode=disable
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The ingestion worker (22-05). ⚠ BEHIND THE `ingest` PROFILE, so a plain
  # `docker compose up` never starts it: with the backend not starting (see
  # above), it would claim the queued jobs 000015 backfilled, fail to reach
  # the token route, and walk every one of them to `dead` -- the accident its
  # fail-closed entrypoint exists to prevent. Start it deliberately with
  # `docker compose --profile ingest up workers`, and only once the backend's
  # internal listener is running. See docs/local-development.md.
  #
  # ⚠ IT NEVER HOLDS THE GITHUB APP KEY (U4): the backend mints it a
  # one-repository, read-only, one-hour token per job, and
  # services/workers/tests/test_compose_environment.py asserts that no
  # GITHUB_APP_* or webhook secret appears in this environment.
  workers:
    build: ./services/workers
    profiles: ["ingest"]
    volumes:
      - ./services/workers:/app
    environment:
      - ENV=development
      # As compose's other services connect: `coderag` is a SUPERUSER, so
      # row-level security is bypassed here and tenant isolation is NOT
      # exercised under compose. A deployment must log in as a NOSUPERUSER
      # NOBYPASSRLS role (docs/api-ingestion-jobs.md, "What a deployed worker
      # needs"); 22-05's live proof ran every process as rag_doc_app.
      - DATABASE_URL=postgres://coderag:coderag@postgres:5432/coderag?sslmode=disable
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # The backend's INTERNAL listener, never the public API on 8080.
      - INTERNAL_API_URL=http://backend:8081
    depends_on:
      postgres:
        condition: service_healthy
    # ⚠ SIX MINUTES TO STOP, NOT DOCKER'S TEN SECONDS (PR #58's review, A-L4;
    # the value is 22.1-05's N6, measured 2026-10-06). SIGTERM makes the worker
    # finish the stretch it is in and stop at the next checkpoint, handing the
    # job back with its attempt; a SIGKILL skips every `finally`, so the job
    # sits `running` until its lease lapses and the token is never revoked.
    # `write_results` has NO checkpoint, so a worker told to stop mid-store
    # finishes the store first: the grace is the larger of two minutes and the
    # store measured at U6's 100,000-chunk cap (297 s) plus 30 s, rounded up
    # to the minute. Shorter, and a store at the cap is killed and rolled back
    # on every shutdown. `workers.jobs.runtime.DEFAULT_STOP_GRACE_PERIOD` is
    # the authority; tests/test_compose_environment.py pins the two together.
    stop_grace_period: 6m
    # Exit 1 is "could not reach the database" -- the case a restart is for
    # (workers/__main__.py). Docker cannot tell it from exit 2, a refusal no
    # restart can fix (OPENAI_API_KEY unset on the host, say), so the retries
    # are bounded: each run spends about three minutes reconnecting before it
    # exits 1, so the first run and five restarts ride out a database outage
    # of about twenty minutes, while a refusal stops after six identical
    # lines instead of looping for as long as compose is up. Docker counts
    # the five per `up`, not per outage.
    restart: on-failure:5
    # P16: ONE worker process (two connections), measured by 22.1-05
    # (2026-10-06, N4): a single worker embedding a large repository already
    # runs at 95 % of the OpenAI key's 1,000,000 tokens a minute, so a second
    # one would only trade time for 429s. Raise it with a higher-tier key, and
    # re-measure. `workers.jobs.runtime.DEFAULT_POOL_SIZE` is the authority.
    # Each process needs about 0.95 GB of free disk for its job directory and
    # up to about 9.7 GB of memory at U6's chunk cap (ISS-042; measured).
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

  frontend:
    build: ./services/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
    environment:
      - ENV=development

  # The qdrant service was retired in 22-03: vectors live in the pgvector
  # Postgres above. An existing `testtgsd_qdrant_data` volume is left alone;
  # see docs/local-development.md, "Qdrant is gone", to remove it.

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
