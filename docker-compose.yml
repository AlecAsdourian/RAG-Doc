version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=coderag
      - POSTGRES_USER=coderag
      - POSTGRES_PASSWORD=coderag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coderag"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./services/backend
    ports:
      - "8080:8080"
    volumes:
      - ./services/backend:/app
    environment:
      - ENV=development
      - DATABASE_URL=postgres://coderag:coderag@postgres:5432/coderag?sslmode=disable
      - RAG_SERVICE_URL=http://rag-api:8000
    depends_on:
      postgres:
        condition: service_healthy

  rag-api:
    build:
      context: ./services/workers
      dockerfile: Dockerfile.api
    ports:
      - "8001:8000"
    volumes:
      - ./services/workers:/app
    environment:
      - DATABASE_URL=postgres://coderag:coderag@postgres:5432/coderag?sslmode=disable
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  workers:
    build: ./services/workers
    volumes:
      - ./services/workers:/app
    environment:
      - ENV=development

  frontend:
    build: ./services/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
    environment:
      - ENV=development

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  qdrant_data:
