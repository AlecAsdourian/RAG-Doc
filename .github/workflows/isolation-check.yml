name: Isolation Test Coverage

# Runs on every PR to main. Fails the check if the diff adds a mutation
# endpoint (POST/PUT/PATCH/DELETE) without a matching isolation test in
# the same PR. See docs/isolation.md and scripts/ci/README.md.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run isolation-test scanner
        id: scan
        continue-on-error: true
        run: |
          python scripts/ci/check-isolation-tests.py \
            --base-ref origin/${{ github.base_ref }} \
            --head-ref HEAD \
            --json > isolation-report.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Comment on PR when coverage is missing
        if: steps.scan.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('isolation-report.json', 'utf8'));
            } catch (e) {
              core.setFailed(`Could not parse scanner report: ${e.message}`);
              return;
            }
            const missing = (report.missing || []).map(
              m => `- \`${m.method} ${m.path}\` in \`${m.file}:${m.line}\``
            );
            const skipped = (report.skipped || []).map(
              s => `- \`${s.endpoint.method} ${s.endpoint.path}\` — reason: _${s.reason}_`
            );
            // Build the body as an array of blocks. Blank lines between
            // blocks are preserved by joining on `\n\n` — filter(Boolean)
            // strips only entire empty blocks, not the blank-line
            // separators we rely on for Markdown paragraph breaks.
            const blocks = [
              '❌ **Isolation test coverage missing**',
              'The following mutation endpoints were added or modified without a matching isolation test:',
              missing.join('\n'),
              'Add a test in `*_isolation_test.go` (Go) or `test_*_isolation.py` (Python) that drives the endpoint. It counts when **one line** holds every static piece of the path **in order** — for `/api/things/{id}/resync`, a line containing `"/api/things/" + id + "/resync"`. Building the path another way (`path.Join`, a helper that splits it up) is not recognised: write the literal path in the test, or use the skip marker below.',
              'To intentionally skip (rare — health checks, webhooks that carry no tenant data): add `// @skip-isolation-test: <reason>` (Go) or `# @skip-isolation-test: <reason>` (Python) on the route line. The reason must be non-empty.',
              skipped.length
                ? '**Endpoints explicitly skipped in this PR (informational):**\n' + skipped.join('\n')
                : '',
              'See `docs/isolation.md` for the full pattern.',
            ].filter(Boolean);
            const body = blocks.join('\n\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail the check when coverage is missing
        if: steps.scan.outcome == 'failure'
        run: exit 1
